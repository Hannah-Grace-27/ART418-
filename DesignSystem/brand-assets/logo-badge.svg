<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Circular Badge Background (Sunny Yellow #EBC25B) -->
  <circle cx="150" cy="150" r="140" fill="#EBC25B" stroke="#000000" stroke-width="6" />
  
  <!-- Interlocking S Mark -->
  <g transform="translate(50, 40) scale(1)" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer curves -->
    <path d="M 140 64 C 140 32, 115 14, 85 14 C 52 14, 32 38, 32 70 C 32 104, 62 120, 100 130" />
    <path d="M 100 90 C 138 100, 168 116, 168 150 C 168 182, 148 206, 115 206 C 85 206, 60 188, 60 156" />
    <!-- Secondary internal ribbon loops -->
    <path d="M 60 70 C 60 48, 76 34, 96 34 C 116 34, 126 48, 126 66 C 126 86, 105 98, 85 106" stroke-width="12" />
    <path d="M 140 150 C 140 172, 124 186, 104 186 C 84 186, 74 172, 74 154 C 74 134, 95 122, 115 114" stroke-width="12" />
  </g>
</svg>
